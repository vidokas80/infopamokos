<!-- ===== ŽAIDIMO PRADŽIA ===== -->
<div id="kd">
<style>
#kd{--bg:#0f1522;--panel:#161e2e;--panel2:#1e2840;--line:#2a3652;--txt:#e9eef8;--mut:#98a5c0;--acc:#4fd1c5;--ok:#46d37b;--bad:#ff5d6c;--gold:#ffcc4d;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;color:var(--txt);background:var(--bg);border-radius:18px;padding:14px;max-width:1000px;margin:0 auto;position:relative;line-height:1.45;text-align:left}
#kd *{box-sizing:border-box}
#kd button{all:unset;box-sizing:border-box;cursor:pointer;font-family:inherit}
#kd .kd-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#kd .kd-title{font-size:20px;font-weight:800;margin-right:auto}
#kd .kd-stat{background:var(--panel2);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--mut);text-transform:uppercase;text-align:center}
#kd .kd-stat b{display:block;font-size:17px;color:var(--txt);text-transform:none}
#kd .kd-ib{background:var(--panel2);padding:7px 11px;border-radius:10px;font-size:16px}
#kd .kd-bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:12px}
#kd .kd-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7ee0a0);width:0;transition:width .4s}
#kd .kd-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
#kd .kd-h{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:10px}
#kd .kd-patient{display:flex;gap:14px;align-items:flex-start}
#kd .kd-ava{font-size:46px;line-height:1;background:var(--panel2);border-radius:16px;padding:10px;flex:none}
#kd .kd-name{font-weight:800;font-size:17px;margin-bottom:6px}
#kd .kd-name span{color:var(--mut);font-weight:500;font-size:14px}
#kd .kd-story{background:#fdfaf3;color:#1d2330;border-radius:4px 14px 14px 14px;padding:11px 14px;font-size:16px;position:relative}
#kd .kd-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){#kd .kd-tools{grid-template-columns:repeat(2,1fr)}}
#kd .kd-tool{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-weight:600;font-size:14px;transition:.15s}
#kd .kd-tool:hover{background:#28345a}
#kd .kd-tool .ic{display:block;font-size:24px}
#kd .kd-tool small{display:block;color:var(--mut);font-weight:500;font-size:12px}
#kd .kd-tool.used{opacity:.45;cursor:default}
#kd .kd-tool.off{opacity:.3;cursor:default}
#kd .kd-res{margin-top:10px;display:flex;flex-direction:column;gap:6px}
#kd .kd-res div{background:#1b2540;border-left:4px solid var(--acc);border-radius:8px;padding:8px 11px;font-size:14.5px;animation:kdin .3s}
@keyframes kdin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#kd .kd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){#kd .kd-grid{grid-template-columns:repeat(2,1fr)}}
#kd .kd-comp{background:#fbf8f3;color:#1d2330;border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:13.5px;border:3px solid transparent;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
#kd .kd-comp:hover{border-color:var(--acc);transform:translateY(-2px)}
#kd .kd-comp img,#kd .kd-comp svg{width:100%;height:78px;object-fit:contain;display:block}
#kd .kd-comp.wrong{border-color:var(--bad);opacity:.45;cursor:default;transform:none}
#kd .kd-comp.right{border-color:var(--ok);box-shadow:0 0 0 3px #46d37b55}
#kd .kd-comp.dim{opacity:.35;cursor:default;transform:none}
#kd .kd-opts{display:flex;flex-direction:column;gap:8px}
#kd .kd-opt{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;transition:.15s}
#kd .kd-opt:hover{border-color:var(--acc)}
#kd .kd-opt.right{border-color:var(--ok);background:#143826}
#kd .kd-opt.wrong{border-color:var(--bad);background:#3d1820}
#kd .kd-opt.dim{opacity:.4;cursor:default}
#kd .kd-msg{margin-top:10px;padding:10px 13px;border-radius:10px;font-weight:600;animation:kdin .3s}
#kd .kd-msg.ok{background:#143826;border:1px solid var(--ok)}
#kd .kd-msg.bad{background:#3d1820;border:1px solid var(--bad)}
#kd .kd-expl{background:#1d2a45;border-left:4px solid var(--gold);padding:11px 13px;border-radius:10px;margin-top:10px}
#kd .kd-btn{display:inline-block;background:var(--acc);color:#052522;font-weight:800;padding:12px 18px;border-radius:12px;margin-top:12px;text-align:center}
#kd .kd-btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
#kd .kd-center{text-align:center;padding:18px 8px}
#kd .kd-big{font-size:54px;line-height:1.1}
#kd h2{margin:6px 0 8px;font-size:24px;color:var(--txt);line-height:1.2}
#kd .kd-center p{color:var(--mut);max-width:560px;margin:6px auto 12px}
#kd .kd-rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;margin:10px auto;text-align:left}
@media (max-width:700px){#kd .kd-rules{grid-template-columns:1fr}}
#kd .kd-rules div{background:var(--panel2);border-radius:12px;padding:10px;font-size:14px;color:var(--mut)}
#kd .kd-rules b{display:block;color:var(--txt);font-size:15px;margin-bottom:2px}
#kd .kd-stars{font-size:36px;color:var(--gold);letter-spacing:4px}
#kd .kd-stars .dim{color:#3a4560}
#kd .kd-sum{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
#kd .kd-sum div{background:var(--panel2);border-radius:12px;padding:8px 16px;color:var(--mut);font-size:13px}
#kd .kd-sum b{display:block;font-size:22px;color:var(--txt)}
#kd .kd-log{max-width:640px;margin:12px auto 0;text-align:left;display:flex;flex-direction:column;gap:5px}
#kd .kd-log div{background:var(--panel2);border-radius:9px;padding:7px 11px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#kd .kd-hide{display:none}
#kd:fullscreen{max-width:none;border-radius:0;overflow:auto}
</style>

  ex:'Žaidimas pats pasakė, kas negerai: procesorius per senas. Nei daugiau OA, nei nauja vaizdo plokštė nepadės – kiekvienas komponentas atlieka savo darbą.'},
 {c:'motherboard',who:'Simonas',ava:'👨',what:'stacionarus kompiuteris',
  story:'Po perkūnijos kompiuteris nebeįsijungia. Meistras jau patikrino – maitinimo blokas veikia ir tiekia elektrą.',
  t:{listen:'Tyla – nors elektra ateina, niekas nepasileidžia.',temp:'Kompiuteris neįsijungia – nėra ką matuoti.',task:'Kompiuteris neįsijungia – programų paleisti negalima.',look:'Ant didžiausios plokštės matosi apdegęs, išsipūtęs elementas ir tamsi dėmė.'},
  fix:['Pakeisti pagrindinę plokštę','Pakeisti maitinimo bloką','Įdėti daugiau operatyviosios atminties'],
  ex:'Maitinimo blokas veikia, bet sudegė pagrindinė plokštė, jungianti visas dalis. Be jos signalai ir energija nepasiekia kitų komponentų.'},
 {c:'motherboard',who:'Rūta',ava:'👧',what:'stacionarus kompiuteris',
  story:'Neveikia nė vienas USB lizdas kompiuterio gale: nei pelė, nei klaviatūra, nei atmintinė. Ta pati pelė ir klaviatūra kitame kompiuteryje veikia puikiai.',
  t:{look:'Galinės jungtys pritvirtintos prie didžiausios plokštės, viena jų aplaužyta.'},
  fix:['Taisyti arba pakeisti pagrindinę plokštę','Įdėti daugiau operatyviosios atminties','Pakeisti vaizdo plokštę'],
  ex:'Galiniai USB, tinklo ir garso lizdai yra pagrindinės plokštės dalis. Kadangi pelė ir klaviatūra veikia kitame kompiuteryje, kalta plokštės jungtis.'}
];
var ROUND=10;

/* ---------- BŪSENA ---------- */
var S={list:[],i:0,score:0,max:0,log:[],sound:true,cur:null};

/* ---------- GARSAS ---------- */
var actx=null;
function beep(fr,dur,type,gap){
 if(!S.sound)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  fr.forEach(function(q,i){var o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=q;
   var t=actx.currentTime+i*(gap||.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.12));
   o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+(dur||.12)+.03);});
 }catch(e){}
}
function lc(s){return /^[A-ZĄČĘĖĮŠŲŪŽ][a-ząčęėįšųūž]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pic(id){return C[id].img?'<img src="'+C[id].img+'" alt="'+C[id].name+'">':FAN_SVG;}

/* ---------- EKRANAI ---------- */
function stats(){
 $('.kd-n').textContent=S.list.length?Math.min(S.i+1,S.list.length)+'/'+S.list.length:'–';
 $('.kd-s').textContent=S.score;
 $('.kd-bar i').style.width=(S.list.length?S.i/S.list.length*100:0)+'%';
}
function start(){
 $('.kd-main').innerHTML='<div class="kd-box kd-center"><div class="kd-big">🩺💻</div><h2>Sveiki atvykę į kompiuterių ligoninę!</h2>'+
 '<p>Šiandien tu – kompiuterių daktaras. Pas tave ateis '+ROUND+' pacientų su sergančiais kompiuteriais. Išklausyk jų skundus, ištirk kompiuterį ir nustatyk, kuris komponentas kaltas.</p>'+
 '<div class="kd-rules"><div><b>1. Ištirk</b>Diagnostikos įrankiai suteikia papildomų užuominų, bet kiekvienas kainuoja 2 taškus.</div><div><b>2. Nustatyk ligą</b>Pasirink kaltą komponentą. Teisingai iš pirmo karto – iki 10 taškų.</div><div><b>3. Išgydyk</b>Pasirink tinkamą gydymą ir gauk dar 5 taškus.</div></div>'+
 '<button class="kd-btn" data-act="go">Pradėti priėmimą →</button></div>';
 S.list=[];S.i=0;S.score=0;stats();
}
function go(){S.list=shuffle(CASES.slice()).slice(0,ROUND);S.i=0;S.score=0;S.max=ROUND*15;S.log=[];show();}
function show(){
 stats();
 var k=S.list[S.i];
 S.cur={tools:{},wrong:0,step:1,diagPts:0,fixPts:0,fixOrder:shuffle(k.fix.map(function(t,i){return i;}))};
 var h='<div class="kd-box"><div class="kd-h">Pacientas '+(S.i+1)+' iš '+S.list.length+'</div><div class="kd-patient"><div class="kd-ava">'+k.ava+'</div><div style="flex:1"><div class="kd-name">'+k.who+' <span>· '+k.what+'</span></div><div class="kd-story">„'+k.story+'“</div></div></div></div>';
 h+='<div class="kd-box"><div class="kd-h">Diagnostikos įrankiai (−2 taškai už kiekvieną)</div><div class="kd-tools">'+
  TOOLS.map(function(t){return '<button class="kd-tool" data-tool="'+t.id+'"><span class="ic">'+t.ic+'</span>'+t.name+'<small>'+t.sub+'</small></button>';}).join('')+
  '</div><div class="kd-res"></div></div>';
 h+='<div class="kd-box kd-step1"><div class="kd-h">1 žingsnis: kuris komponentas serga?</div><div class="kd-grid">'+
  ORDER.map(function(id){return '<button class="kd-comp" data-comp="'+id+'">'+pic(id)+'<span>'+C[id].name+'</span></button>';}).join('')+
  '</div><div class="kd-m1"></div></div>';
 h+='<div class="kd-box kd-step2 kd-hide"><div class="kd-h">2 žingsnis: kaip gydysi?</div><div class="kd-opts">'+
  S.cur.fixOrder.map(function(i){return '<button class="kd-opt" data-fix="'+i+'">'+k.fix[i]+'</button>';}).join('')+
  '</div><div class="kd-m2"></div></div>';
 $('.kd-main').innerHTML=h;
 app.scrollIntoView({behavior:'smooth',block:'start'});
}
function useTool(id,btn){
 var k=S.list[S.i];
 if(S.cur.step>2||S.cur.tools[id])return;
 S.cur.tools[id]=1;btn.classList.add('used');beep([520],.08);
 var t=TOOLS.filter(function(x){return x.id===id;})[0];
 $('.kd-res').insertAdjacentHTML('beforeend','<div><b>'+t.ic+' '+t.name+':</b> '+(k.t[id]||t.def)+'</div>');
}
function diag(id,btn){
 var k=S.list[S.i];
 if(S.cur.step!==1||btn.classList.contains('wrong'))return;
 if(id===k.c){
  var n=Object.keys(S.cur.tools).length;
  S.cur.diagPts=Math.max(0,10-2*n-5*S.cur.wrong);if(S.cur.wrong>=2)S.cur.diagPts=0;
  S.score+=S.cur.diagPts;S.cur.step=2;btn.classList.add('right');beep([660,880]);
  Array.prototype.forEach.call(app.querySelectorAll('.kd-comp'),function(b){if(b!==btn)b.classList.add('dim');});
  $('.kd-m1').innerHTML='<div class="kd-msg ok">✅ Teisinga diagnozė – '+lc(C[id].name)+'! +'+S.cur.diagPts+' tšk.</div>';
  var s2=$('.kd-step2');s2.classList.remove('kd-hide');s2.scrollIntoView({behavior:'smooth',block:'center'});
 } else {
  S.cur.wrong++;btn.classList.add('wrong');beep([220,170],.15,'square');
  var msg='❌ Ne, '+lc(C[id].name)+' sveikas. Perskaityk skundą dar kartą.';
  if(S.cur.wrong===1)msg+=' Gal pasinaudok diagnostikos įrankiais?';
  if(S.cur.wrong>=2){var lk=app.querySelector('[data-tool="look"]');if(!S.cur.tools.look){S.cur.tools.look=1;lk.classList.add('used');$('.kd-res').insertAdjacentHTML('beforeend','<div><b>🔦 Vyresnysis daktaras apžiūrėjo vidų:</b> '+(k.t.look||TOOLS[3].def)+'</div>');}msg+=' Vyresnysis daktaras padėjo – žiūrėk įrankių rezultatus.';}
  $('.kd-m1').innerHTML='<div class="kd-msg bad">'+msg+'</div>';
 }
 stats();
}
function fix(i,btn){
 var k=S.list[S.i];
 if(S.cur.step!==2)return;
 S.cur.step=3;
 var ok=(+i===0);
 if(ok){S.cur.fixPts=5;S.score+=5;btn.classList.add('right');beep([523,659,784],.15);}
 else{btn.classList.add('wrong');beep([220,170],.15,'square');app.querySelector('[data-fix="0"]').classList.add('right');}
 Array.prototype.forEach.call(app.querySelectorAll('.kd-opt'),function(b){if(!b.classList.contains('right')&&!b.classList.contains('wrong'))b.classList.add('dim');});
 S.log.push({k:k,pts:S.cur.diagPts+S.cur.fixPts});
 var last=S.i+1>=S.list.length;
 $('.kd-m2').innerHTML='<div class="kd-msg '+(ok?'ok':'bad')+'">'+(ok?'✅ Pacientas išgydytas! +5 tšk.':'❌ Šis gydymas nepadėtų. Teisingas gydymas pažymėtas žaliai.')+'</div>'+
  '<div class="kd-expl">🩺 <b>Daktaro paaiškinimas.</b> '+k.ex+'</div>'+
  '<button class="kd-btn" data-act="next">'+(last?'Baigti pamainą 🏁':'Kitas pacientas →')+'</button>';
 stats();
 $('.kd-m2').scrollIntoView({behavior:'smooth',block:'center'});
}
function next(){S.i++;if(S.i>=S.list.length)end();else show();}
function end(){
 stats();
 var p=S.score/S.max,rank,st;
 if(p>=.85){rank='🏆 Kompiuterių daktaras';st=3;}else if(p>=.65){rank='🔧 Meistras';st=2;}else if(p>=.4){rank='🪛 Technikas';st=1;}else{rank='📘 Praktikantas';st=0;}
 var stars='';for(var i=0;i<3;i++)stars+=i<st?'★':'<span class="dim">★</span>';
 var good=S.log.filter(function(l){return l.pts>=10;}).length;
 beep([523,659,784,1047],.2);
 $('.kd-main').innerHTML='<div class="kd-box kd-center"><div class="kd-big">🏁</div><h2>Pamaina baigta!</h2><div class="kd-stars">'+stars+'</div>'+
  '<p style="font-size:18px;color:var(--txt);font-weight:700">Tavo laipsnis: '+rank+'</p>'+
  '<div class="kd-sum"><div><b>'+S.score+'/'+S.max+'</b>taškų</div><div><b>'+good+'/'+S.list.length+'</b>puikiai išgydyta</div></div>'+
  '<div class="kd-log">'+S.log.map(function(l){return '<div><span>'+l.k.ava+' '+l.k.who+' – '+lc(C[l.k.c].name)+'</span><b>'+l.pts+'/15</b></div>';}).join('')+'</div>'+
  '<button class="kd-btn" data-act="go">🔁 Nauja pamaina</button></div>';
 $('.kd-bar i').style.width='100%';
}

/* ---------- PASPAUDIMAI ---------- */
app.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b||!app.contains(b))return;
 var a=b.getAttribute('data-act');
 if(b.hasAttribute('data-tool'))return useTool(b.getAttribute('data-tool'),b);
 if(b.hasAttribute('data-comp'))return diag(b.getAttribute('data-comp'),b);
 if(b.hasAttribute('data-fix'))return fix(b.getAttribute('data-fix'),b);
 if(a==='go')return go();
 if(a==='next')return next();
 if(a==='sound'){S.sound=!S.sound;b.textContent=S.sound?'🔊':'🔇';return;}
 if(a==='fs'){if(document.fullscreenElement)document.exitFullscreen();else if(app.requestFullscreen)app.requestFullscreen();}
});
start();
})();
</script>
</div>
<!-- ===== ŽAIDIMO PABAIGA ===== -->

</body>
