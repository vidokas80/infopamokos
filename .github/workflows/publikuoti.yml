# Kiekvieną kartą, kai į main šaką įkeliami pakeitimai:
# patikrina projektą, sugeneruoja svetainę ir paskelbia ją GitHub Pages (infopamokos.lt).
# Jei tikrinimas randa klaidų, svetainė nepublikuojama – sena versija lieka veikti.
name: Publikuoti svetainę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tikrinti šaltinio failus
        run: python check.py
      - name: Generuoti svetainę
        run: python build.py
      - name: Tikrinti sugeneruotą svetainę
        run: python check.py --built
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
