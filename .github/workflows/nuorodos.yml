# Kartą per mėnesį (1 d. 6:00 UTC) patikrina, ar veikia visos išorinės nuorodos
# (NŠA užduotys, teisės aktai, šaltiniai). Jei kuri nors neveikia, darbas baigiasi klaida,
# o GitHub apie tai praneša el. paštu. Paleisti ranka: Actions → Tikrinti nuorodas → Run workflow.
name: Tikrinti nuorodas

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: python check.py --external
